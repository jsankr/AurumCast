name: Daily gold rates

on:
  schedule:
    - cron: '17 2 * * *'   # 07:47 IST every day (before the 09:00 MCX open). GitHub may start it a few minutes late.
  workflow_dispatch:        # "Run workflow" button for an on-demand update

permissions:
  contents: write

concurrency:
  group: daily-gold
  cancel-in-progress: false

jobs:
  rates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests (all engine functions)
        run: node --test

      - name: Build dashboard
        run: node scripts/build-dashboard.mjs

      - name: Fetch live data, validate, publish
        run: node scripts/daily.mjs

      - name: Commit validated results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll docs reports README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Gold rates $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
            git push
          fi
